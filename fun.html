// CORS proxy for CounterAPI when loaded from GitHub Pages (api.counterapi.dev does not send CORS headers)
const counterApiUrl = (path) => {
    const url = 'https://api.counterapi.dev/v1/' + path.replace(/^\//, '');
    if (typeof window !== 'undefined' && window.location.protocol !== 'file:') {
        return 'https://api.cors.lol/?' + new URLSearchParams({ url }).toString();
    }
    return url;
};

// ============================================
const HitCounter = () => {
    const [count, setCount] = React.useState(null);
    const [loading, setLoading] = React.useState(true);

    React.useEffect(() => {
        // Use CountAPI - a simple free counter service
        fetch(counterApiUrl('sumit-biodata-2026/visits-fun/up'))
            .then(res => res.json())
            .then(data => {
                setCount(data.count ?? data.value);
                setLoading(false);
            })
            .catch(() => {
                // Fallback to localStorage if API fails (per-page)
                const stored = localStorage.getItem('sumit-biodata-visits-fun') || '0';
                let num = parseInt(stored);
                if (!sessionStorage.getItem('counted-fun')) {
                    num += 1;
                    localStorage.setItem('sumit-biodata-visits-fun', num.toString());
                    sessionStorage.setItem('counted-fun', 'true');
                }
                setCount(num);
                setLoading(false);
            });
    }, []);

    return (
        <div className="flex justify-center mb-4">
            <div className="hit-counter flex items-center gap-3">
                <span className="text-xl">👁️</span>
                <span className="text-dark-300">Visitors:</span>
                <span className="text-yellow-400 font-bold text-xl">
                    {loading ? '...' : count}
                </span>
            </div>
        </div>
    );
};

// CONFETTI EFFECT
// ============================================
const Confetti = () => {
    const [confetti, setConfetti] = React.useState([]);
    const colors = React.useMemo(() => ['#EC4899', '#f472b6', '#f9a8d4', '#fbcfe8', '#fce7f3'], []);
    const shapes = React.useMemo(() => ['❤️', '💕', '💗', '💖', '💘', '💝', '💞', '🌹', '✨'], []);

    React.useEffect(() => {
        const createConfetti = () => {
            const newConfetti = [];
            for (let i = 0; i < 15; i++) {
                const isEmoji = Math.random() > 0.5;
                newConfetti.push({
                    id: Date.now() + i,
                    left: Math.random() * 100,
                    delay: Math.random() * 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 12 + 8,
                    duration: Math.random() * 4 + 5,
                    isEmoji,
                    emoji: shapes[Math.floor(Math.random() * shapes.length)]
                });
            }
            setConfetti(newConfetti);
        };
        createConfetti();
        const interval = setInterval(createConfetti, 8000);
        return () => clearInterval(interval);
    }, []);

    return (
        <div className="fixed inset-0 pointer-events-none z-40 overflow-hidden">
            {confetti.map(c => (
                c.isEmoji ? (
                    <span
                        key={c.id}
                        style={{
                            position: 'fixed',
                            left: `${c.left}%`,
                            top: '-50px',
                            fontSize: `${c.size * 2}px`,
                            animation: `confetti-fall ${c.duration}s linear ${c.delay}s forwards`,
                            opacity: 0.8
                        }}
                    >
                        {c.emoji}
                    </span>
                ) : (
                    <div
                        key={c.id}
                        style={{
                            position: 'fixed',
                            left: `${c.left}%`,
                            top: '-20px',
                            backgroundColor: c.color,
                            width: `${c.size}px`,
                            height: `${c.size}px`,
                            borderRadius: Math.random() > 0.5 ? '50%' : '3px',
                            animation: `confetti-fall ${c.duration}s linear ${c.delay}s forwards`
                        }}
                    />
                )
            ))}
        </div>
    );
};

// EMOJI CURSOR
// ============================================
const EmojiCursor = () => {
    const [position, setPosition] = React.useState({ x: 0, y: 0 });
    const [isVisible, setIsVisible] = React.useState(false);

    React.useEffect(() => {
        const handleMouseMove = (e) => {
            setPosition({ x: e.clientX, y: e.clientY });
            setIsVisible(true);
        };

        const handleMouseEnter = () => setIsVisible(true);
        const handleMouseLeave = () => setIsVisible(false);

        window.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseenter', handleMouseEnter);
        document.addEventListener('mouseleave', handleMouseLeave);

        return () => {
            window.removeEventListener('mousemove', handleMouseMove);
            document.removeEventListener('mouseenter', handleMouseEnter);
            document.removeEventListener('mouseleave', handleMouseLeave);
        };
    }, []);

    if (!isVisible) return null;

    return (
        <div
            className="emoji-cursor"
            style={{
                left: position.x,
                top: position.y,
                transform: 'translate(-50%, -50%)',
                fontSize: '20px'
            }}
        >
            ❤️
        </div>
    );
};

// FOOTER
// ============================================
const parseCount = (d) => {
    if (d == null) return 0;
    const n = d.count ?? d.value ?? d;
    return typeof n === 'number' && !Number.isNaN(n) ? n : 0;
};

const Footer = () => {
    const [likeCount, setLikeCount] = React.useState(0);
    const [dislikeCount, setDislikeCount] = React.useState(0);

    const fetchCounts = React.useCallback(() => {
        if (typeof window === 'undefined' || window.location.protocol === 'file:') return;
        const ns = 'sumit-biodata-2026';
        Promise.all([
            fetch(counterApiUrl(`${ns}/fun-likes`)).then(r => r.json()).then(parseCount).catch(() => 0),
            fetch(counterApiUrl(`${ns}/fun-dislikes`)).then(r => r.json()).then(parseCount).catch(() => 0)
        ]).then(([likes, dislikes]) => {
            setLikeCount(likes);
            setDislikeCount(dislikes);
        });
    }, []);

    React.useEffect(() => {
        fetchCounts();
        const onUpdate = () => setTimeout(fetchCounts, 400);
        window.addEventListener('counter-updated', onUpdate);
        return () => window.removeEventListener('counter-updated', onUpdate);
    }, [fetchCounts]);

    return (
        <footer className="py-10 border-t border-dark-700 relative z-10 bg-dark-900">
            <div className="max-w-7xl mx-auto px-6 text-center space-y-4">
                {/* Feedback Button */}

                        📝 Share Your Feedback
                    </a>
                </div>

                {/* Hit Counter */}
                <HitCounter />

                <p className="text-gray-300">Last Updated: 09-02-2026</p>
                <p className="text-2xl flex items-center justify-center gap-2 text-white">
                    Made with <span className="animate-heartbeat text-red-500 text-3xl">❤️</span>
                </p>
                <p className="text-gray-300 text-sm mt-4">
                    🌐 Best viewed on: Chrome 90+ | Firefox 88+ | Edge 90+ | Safari 14+
                </p>
                <p className="text-gray-300 text-sm mt-3">
                    <a href="index.html" className="hover:text-yellow-400 transition-colors">Home</a>
                    {' · '}
                    <a href="simple.html" className="hover:text-yellow-400 transition-colors">Simple</a>
                    {' · '}
                    <span className="text-gray-500">Fun</span>
                </p>
                <p className="text-gray-300 text-sm mt-4">
                    © 2026 Sumit. All Rights Reserved.
                </p>
                <p className="text-gray-300 text-sm mt-2">
                    Thanks to everyone who provided guidance/feedback; and cursor!
                </p>
                {/* Like / Dislike counts - barely visible */}
                <p className="text-sm mt-2 select-none" style={{ color: 'rgba(148, 163, 184, 0.04)' }}>
                    👍 {likeCount} &nbsp; 👎 {dislikeCount}
                </p>
            </div>
        </footer>
    );
};
