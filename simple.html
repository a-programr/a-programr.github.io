const ThemeContext = React.createContext();

const ThemeProvider = ({ children }) => {
    const [isDark, setIsDark] = React.useState(false);

    React.useEffect(() => {
        // Check localStorage for saved preference
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') {
            setIsDark(true);
            document.body.classList.add('dark-mode');
        }
    }, []);

    const toggleTheme = () => {
        setIsDark(prev => {
            const newValue = !prev;
            if (newValue) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('theme', 'light');
            }
            return newValue;
        });
    };

    return (
        <ThemeContext.Provider value={{ isDark, toggleTheme }}>
            {children}
        </ThemeContext.Provider>
    );
};

const useTheme = () => React.useContext(ThemeContext);

// All counters use counterapi.dev (same as working commit 3/4 - CORS, no proxy)
const COUNTAPI_NS = 'sumit-biodata-2026';
const VISITOR_HIT_URL = 'https://api.counterapi.dev/v1/' + COUNTAPI_NS + '/visits-simple/up';
const LIKES_HIT_URL = 'https://api.counterapi.dev/v1/' + COUNTAPI_NS + '/simple-likes/up';
const DISLIKES_HIT_URL = 'https://api.counterapi.dev/v1/' + COUNTAPI_NS + '/simple-dislikes/up';
const COUNTAPI_GET = (key) => 'https://api.counterapi.dev/v1/' + COUNTAPI_NS + '/' + key;
const countApiGet = (key) => {
    const url = COUNTAPI_GET(key);
    const parse = (r) => r.json().catch(() => r.text().then((t) => { try { return JSON.parse(t); } catch (_) { throw new Error('invalid'); } }));
    return fetch(url).then(parse).catch(() =>
        fetch('https://corsproxy.io/?' + encodeURIComponent(url)).then(parse).catch(() =>
            fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)).then((r) => r.text()).then((t) => { try { return JSON.parse(t); } catch (_) { throw new Error('invalid'); } })
        )
    );
};

// HIT COUNTER COMPONENT
// ============================================
const HitCounter = () => {
    const [count, setCount] = React.useState(null);
    const [loading, setLoading] = React.useState(true);

    React.useEffect(() => {
        // Use CounterAPI (same as working commit 3/4)
        fetch(VISITOR_HIT_URL)
            .then(res => res.json())
            .then(data => {
                setCount(data != null ? data.count : null);
                setLoading(false);
            })
            .catch(() => {
                const stored = localStorage.getItem('sumit-biodata-visits-simple') || '100';
                let num = parseInt(stored, 10) || 0;
                if (!sessionStorage.getItem('counted-simple')) {
                    num += 1;
                    localStorage.setItem('sumit-biodata-visits-simple', String(num));
                    sessionStorage.setItem('counted-simple', 'true');
                }
                setCount(num);
                setLoading(false);
            });
    }, []);

    return (
        <div className="flex justify-center mb-4">
            <div className="hit-counter flex items-center gap-3">
                <span className="text-xl">👁️</span>
                <span style={{color: 'var(--text-muted)'}}>Visitors:</span>
                <span className="font-bold text-xl" style={{color: 'var(--text-secondary)'}}>
                    {loading ? '...' : count}
                </span>
            </div>
        </div>
    );
};

// FOOTER

const parseCount = (d) => {
    if (d == null) return 0;
    const n = d.count ?? d.value ?? d;
    return typeof n === 'number' && !Number.isNaN(n) ? n : 0;
};

const LIKES_STORAGE_KEY = 'sumit-biodata-simple-likes';
const DISLIKES_STORAGE_KEY = 'sumit-biodata-simple-dislikes';
const getInitialCounts = () => {
    if (typeof window === 'undefined') return [0, 0];
    return [
        parseInt(localStorage.getItem(LIKES_STORAGE_KEY) || '0', 10),
        parseInt(localStorage.getItem(DISLIKES_STORAGE_KEY) || '0', 10)
    ];
};

const Footer = () => {
    const [likeCount, setLikeCount] = React.useState(() => getInitialCounts()[0]);
    const [dislikeCount, setDislikeCount] = React.useState(() => getInitialCounts()[1]);

    // Fetch like/dislike counts from API when the page loads (not only on click)
    React.useEffect(() => {
        if (typeof window === 'undefined') return;
        Promise.all([
            countApiGet(LIKES_KEY).then(parseCount).catch(() => 0),
            countApiGet(DISLIKES_KEY).then(parseCount).catch(() => 0)
        ]).then(([likes, dislikes]) => {
            const storedLikes = parseInt(localStorage.getItem(LIKES_STORAGE_KEY) || '0', 10);
            const storedDislikes = parseInt(localStorage.getItem(DISLIKES_STORAGE_KEY) || '0', 10);
            if (likes === 0 && dislikes === 0 && (storedLikes > 0 || storedDislikes > 0)) {
                setLikeCount(storedLikes);
                setDislikeCount(storedDislikes);
                return;
            }
            setLikeCount(likes);
            setDislikeCount(dislikes);
            localStorage.setItem(LIKES_STORAGE_KEY, String(likes));
            localStorage.setItem(DISLIKES_STORAGE_KEY, String(dislikes));
        });
    }, []);

    React.useEffect(() => {
        const onUpdate = (e) => {
            const d = e.detail;
            if (d && d.type === 'like') {
                setLikeCount((c) => {
                    const n = c + 1;
                    localStorage.setItem(LIKES_STORAGE_KEY, String(n));
                    return n;
                });
            } else if (d && d.type === 'dislike') {
                setDislikeCount((c) => {
                    const n = c + 1;
                    localStorage.setItem(DISLIKES_STORAGE_KEY, String(n));
                    return n;
                });
            }
        };
        window.addEventListener('counter-updated', onUpdate);
        return () => window.removeEventListener('counter-updated', onUpdate);
    }, []);

    return (
        <footer className="py-8 border-t relative z-10" style={{borderColor: 'var(--border-color)', background: 'var(--bg-primary)'}}>
            <div className="max-w-4xl mx-auto px-6 text-center space-y-6">
                {/* Feedback Button */}
                <div>
                    <a href="https://docs.google.com/forms/d/e/1FAIpQLScf7iqqMNthodb98hQMQNc15fkq8yggGEZncGpU05v41FfRZw/viewform" className="inline-flex items-center gap-2 px-6 py-3 gradient-bg rounded-lg font-medium gradient-btn-text hover:opacity-90 transition-opacity text-sm">
                        Share Your Feedback
                    </a>
                </div>

                {/* Hit Counter */}
                <HitCounter />

                <div className="pt-4 space-y-2">
                    <p className="text-sm" style={{color: 'var(--text-muted)'}}>Last Updated: 13-02-2026</p>
                    <p className="text-sm" style={{color: 'var(--text-secondary)'}}>
                        Made with <span className="animate-heartbeat text-red-500 text-2xl">❤️</span>
                    </p>
                    <p className="text-xs pt-2" style={{color: 'var(--text-muted)'}}>
                        <a href="index.html" className="hover:underline" style={{color: 'var(--text-muted)'}}>Home</a>
                        {' · '}
                        <span style={{color: 'var(--text-muted)', opacity: 0.8}}>Simple</span>
                        {' · '}
                        <a href="fun.html" className="hover:underline" style={{color: 'var(--text-muted)'}}>Fun</a>
                    </p>
                    <p className="text-xs pt-1" style={{color: 'var(--text-muted)'}}>
                        © 2026 Sumit. All Rights Reserved.
                    </p>
                    <p className="text-xs pt-1" style={{color: 'var(--text-muted)'}}>
                        Thanks to everyone who provided guidance/feedback; and cursor!
                    </p>
                    {/* Like / Dislike counts - barely visible (same as fun.html) */}
                    <p className="text-sm mt-2 select-none" style={{ color: 'var(--text-muted)', opacity: 0.04 }}>
                        👍 {likeCount} &nbsp; 👎 {dislikeCount}
                    </p>
                </div>
            </div>
        </footer>
    );
};
