<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumit | Matrimonial Biodata</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(160deg, #faf8f5 0%, #f0ede8 50%, #e8e4de 100%);
            color: #1c1917;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .name {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 6vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #1c1917;
        }
        .tagline {
            font-size: 0.95rem;
            color: #78716c;
            margin-bottom: 2.5rem;
        }
        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            justify-content: center;
            max-width: 560px;
        }
        .card {
            display: block;
            width: 100%;
            max-width: 260px;
            padding: 1.75rem 1.5rem;
            background: #fff;
            border-radius: 1rem;
            border: 1px solid rgba(0,0,0,0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            text-decoration: none;
            color: inherit;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0,0,0,0.1);
        }
        .card-emoji {
            font-size: 2.5rem;
            margin-bottom: 0.75rem;
        }
        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }
        .card-desc {
            font-size: 0.8rem;
            color: #78716c;
            line-height: 1.4;
        }
        .footer-note {
            margin-top: 2.5rem;
            font-size: 0.75rem;
            color: #a8a29e;
        }
    </style>
</head>
<body>
    <h1 class="name">Hey There!</h1>
    <p class="tagline">Choose how you’d like to view the biodata</p>

    <div class="cards">
        <a href="simple.html" class="card">
            <span class="card-emoji">📄</span>
            <div class="card-title">Simple</div>
            <div class="card-desc">Clean, minimal layout with light & dark mode</div>
        </a>
        <a href="fun.html" class="card">
            <span class="card-emoji">🌹</span>
            <div class="card-title">Fun</div>
            <div class="card-desc">Vibrant style with extra flair</div>
        </a>
            </div>

    <p class="footer-note">© 2026 Sumit. All Rights Reserved.</p>
</body>
</html>
